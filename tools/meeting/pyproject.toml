[project]
# Subtext 会議ハーネス: 録音(Unit A)→議事録(Unit B)→Slack を「ターミナル起点」で
# 駆動するオーケストレータ + コスト台帳。各ユニットは subprocess 経由で呼ぶだけで、
# ユニット契約(FR-16)には踏み込まない（疎結合を維持）。
name = "subtext-meeting"
version = "1.1.0"
description = "Subtext 会議ハーネス: ターミナル起点オーケストレータ + コスト台帳"
requires-python = ">=3.13"
# CLI 本体は標準ライブラリのみ（tomllib/subprocess/json/pathlib/argparse）。TUI（meeting tui）
# のみ textual に依存する。依存はバージョン完全固定（NFR-SEC-05。範囲指定せず == でピン留め）。
dependencies = [
    "textual==8.2.8",
]

[project.scripts]
# CLI エントリ。`uv run meeting <cmd>` で起動。
meeting = "meeting.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=meeting --cov-report=term-missing"
markers = [
    "unit: 単体テスト（外部依存なし・純粋ロジック）",
    "integration: 結合テスト（subprocess/ファイル I/O を含む）",
]
